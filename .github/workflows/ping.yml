name: Keep Nems awake

# Render free = 750 h/month for the whole workspace. Nems is kept awake 19 h a day
# (06:00-01:00 Algeria time) = ~570 h, leaving the rest for Nems Ticket, which wakes on demand.
on:
  schedule:
    - cron: "*/10 5-23 * * *"  # every 10 min, 05:00-23:59 UTC = 06:00-00:59 Algeria
    - cron: "0 3 1,15 * *"     # twice a month: keep this repo active so GitHub keeps the schedule on
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    if: github.event.schedule != '0 3 1,15 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the site
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 https://nems-i47a.onrender.com/ || echo 000)
          echo "https://nems-i47a.onrender.com/ -> $code"

  keep-active:
    if: github.event.schedule == '0 3 1,15 * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Record heartbeat
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > last-alive.txt
          git config user.name "nems-ping"
          git config user.email "actions@users.noreply.github.com"
          git add last-alive.txt
          git commit -m "heartbeat" || exit 0
          git push
